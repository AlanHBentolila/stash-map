<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1a17">
  <meta name="description" content="Fan-made map of money stashes in Leonida, with a checklist saved on your phone.">
  <title>StashVI</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Top bar: name, progress and language button -->
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">$</span>
      <div>
        <h1>StashVI</h1>
        <p class="tagline" data-t="tagline"></p>
      </div>
    </div>
    <button id="lang-btn" class="lang-btn" type="button"></button>
  </header>

  <div class="progress" aria-live="polite">
    <div class="progress-text" id="progress-text"></div>
    <div class="progress-bar"><span id="progress-fill"></span></div>
  </div>

  <main>
    <!-- Map view -->
    <section id="view-map" class="view active" aria-labelledby="tab-map">
      <div id="map"></div>
      <div id="pick-hint" class="pick-hint" hidden></div>
    </section>

    <!-- List view -->
    <section id="view-list" class="view" aria-labelledby="tab-list">
      <div class="list-wrap">
        <h2 data-t="listTitle"></h2>
        <ol id="stash-list" class="stash-list"></ol>
        <p class="note" data-t="savedNote"></p>
        <button id="reset-btn" class="link-btn" type="button" data-t="resetChecklist"></button>
        <footer class="credits">
          <p data-t="disclaimer"></p>
          <p><span data-t="mapCredit"></span>
            <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a> ·
            <a href="https://github.com/rolux/gtadb.org" target="_blank" rel="noopener">gtadb.org</a> ·
            <a href="https://github.com/navanem/gta6-leonida-atlas" target="_blank" rel="noopener">Leonida Atlas</a>
          </p>
        </footer>
      </div>
    </section>
  </main>

  <!-- Bottom tabs (easy to reach with a thumb) -->
  <nav class="tabs" role="tablist">
    <button id="tab-map" class="tab active" role="tab" aria-selected="true" data-view="map" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Zm0 2.2 6 2v11.6l-6-2V6.2Z"/></svg>
      <span data-t="tabMap"></span>
    </button>
    <button id="tab-list" class="tab" role="tab" aria-selected="false" data-view="list" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h2v2H4V6Zm4 0h12v2H8V6Zm-4 5h2v2H4v-2Zm4 0h12v2H8v-2Zm-4 5h2v2H4v-2Zm4 0h12v2H8v-2Z"/></svg>
      <span data-t="tabList"></span>
    </button>
  </nav>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/stashes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
